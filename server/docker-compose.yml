version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passio-sorrento-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-passio-production-secret-key}
      - API_KEY=${API_KEY:-dev-api-key}
      - CAPOFILA_SECRET=${CAPOFILA_SECRET:-capofila123}
      - DATABASE_URL=sqlite:////app/instance/holyweek.db
    volumes:
      - ./instance:/app/instance
