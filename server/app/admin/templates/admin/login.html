<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Holyweek Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
</head>

<body class="h-full font-sans bg-slate-900 flex items-center justify-center">
    <div class="w-full max-w-sm px-4">
        <div class="text-center mb-8">
            <span class="text-4xl">⛪</span>
            <h1 class="text-2xl font-bold text-white mt-3">Holyweek Admin</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to manage your data</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div
            class="mb-4 px-4 py-3 rounded-lg text-sm
            {{ 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' if cat == 'success' else 'bg-red-500/10 text-red-400 border border-red-500/20' }}">
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700/50 space-y-5">
            {{ form.hidden_tag() }}

            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" id="username" value="{{ form.username.data or '' }}" required
                    minlength="3" maxlength="64" autocomplete="username"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800">
                Sign in
            </button>
        </form>
    </div>
</body>

</html>
