databases:
  - name: passio-postgres
    plan: free
    region: frankfurt
    databaseName: passiodb
    user: passiouser

services:
  - type: web
    name: passio-sorrento-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: frankfurt
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: CAPOFILA_SECRET
        value: capofila123
      - key: DATABASE_URL
        fromDatabase:
          name: passio-postgres
          property: connectionString
