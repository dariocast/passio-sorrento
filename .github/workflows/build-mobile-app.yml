name: Build Public Mobile App (Android & iOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Mobile (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Code
        run: |
          cd mobile
          flutter analyze lib

      - name: Run Tests
        run: |
          cd mobile
          flutter test

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Build Android App Bundle (AAB for Play Store)
        run: |
          cd mobile
          flutter build appbundle --release

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: passio-sorrento-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Mobile AAB
        uses: actions/upload-artifact@v4
        with:
          name: passio-sorrento-mobile-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
