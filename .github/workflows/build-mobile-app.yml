name: Build Public Mobile App (Android & iOS)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Mobile (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Code
        run: |
          cd mobile
          flutter analyze lib

      - name: Run Tests
        run: |
          cd mobile
          flutter test

      - name: Decode & Configure Android Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.jks
          echo "ANDROID_KEYSTORE_PATH=/tmp/keystore/release.jks" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB for Play Store)
        run: |
          cd mobile
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Clean up Keystore
        if: always()
        run: |
          rm -rf /tmp/keystore

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: passio-sorrento-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Mobile AAB
        uses: actions/upload-artifact@v4
        with:
          name: passio-sorrento-mobile-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
