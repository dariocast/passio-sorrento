name: Build Tracker App (Android)

on:
  push:
    branches: [ main ]
    paths:
      - 'tracker_app/**'
      - '.github/workflows/build-tracker-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Tracker (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd tracker_app
          flutter pub get

      - name: Analyze & Test
        run: |
          cd tracker_app
          flutter analyze lib

      - name: Build Android Release APK
        run: |
          cd tracker_app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB for Play Store)
        run: |
          cd tracker_app
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passio-tracker-apk
          path: tracker_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passio-tracker-aab
          path: tracker_app/build/app/outputs/bundle/release/app-release.aab
